name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend   # ajusta si tu carpeta se llama distinto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22            # usa la versión de Node que uses en local
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Backend.slnx
      - run: dotnet build Backend.slnx --no-restore -c Release
      # xunit v3 usa Microsoft.Testing.Platform (ver backend/global.json), de ahí --solution y los argumentos tras "--".
      # Mismo filtro que el agente: las pruebas de integración (Category=Integration) necesitan servicios externos y quedan fuera.
      - run: dotnet test --solution Backend.slnx --no-build -c Release -- --filter-not-trait "Category=Integration"

  sync-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SyncAgent.slnx
      - run: dotnet build SyncAgent.slnx --no-restore -c Release
      # xunit v3 usa Microsoft.Testing.Platform (ver sync-agent/global.json), de ahí --solution y los argumentos tras "--".
      # Las pruebas de integración (Category=Integration) necesitan el SQL Server de Docker y se omiten solas sin la variable
      # SYNCAGENT_TEST_CONNECTION; el filtro las deja fuera de forma explícita.
      - run: dotnet test --solution SyncAgent.slnx --no-build -c Release -- --filter-not-trait "Category=Integration"
